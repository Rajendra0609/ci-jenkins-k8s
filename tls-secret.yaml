apiVersion: v1
kind: Secret
metadata:
  name: jenkins-tls
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # This secret was previously created imperatively via:
    # kubectl create secret tls jenkins-tls --key tls.key --cert tls.crt -n jenkins
    # It is now declared as a manifest so ArgoCD can manage it.
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
