apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: jenkins
  annotations:
    # This Application manages the Jenkins deployment via ArgoCD
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    # Ensures all child resources are deleted when Application is deleted
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # ⚠️  Replace with your actual Git repository URL
    repoURL: https://github.com/YOUR_ORG/YOUR_REPO.git
    targetRevision: HEAD   # or a specific branch/tag e.g. main / v1.0.2
    path: jenkins           # folder inside the repo that holds these manifests

  destination:
    server: https://kubernetes.default.svc   # in-cluster deployment
    namespace: jenkins

  syncPolicy:
    automated:
      prune: true        # delete resources removed from Git
      selfHeal: true     # revert manual kubectl edits automatically
    syncOptions:
      - CreateNamespace=true          # let ArgoCD create the jenkins namespace if missing
      - ApplyOutOfSyncOnly=true       # only apply resources that have drifted
      - ServerSideApply=true          # use server-side apply for better conflict handling
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    # Ignore the token field in ServiceAccount tokens (injected by k8s)
    - group: ""
      kind: Secret
      name: jenkins-sa-token
      jsonPointers:
        - /data/token
        - /data/ca.crt
        - /data/namespace
    # Ignore HPA current replicas (managed by k8s autoscaler)
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status
