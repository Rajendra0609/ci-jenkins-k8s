<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box { fill:#f7f7f9; stroke:#333; stroke-width:2; rx:8; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#222 }
    .title { font-family: Arial; font-size:16px; font-weight:bold }
    .small { font-size:12px; fill:#555 }
    .arrow { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrowhead) }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="20" y="28" class="title">Jenkins Kubernetes Deployment Overview</text>

  <!-- Ingress -->
  <rect x="30" y="60" width="160" height="60" class="box"/>
  <text x="40" y="95" class="label">Ingress / LoadBalancer</text>

  <!-- Service -->
  <rect x="260" y="60" width="160" height="60" class="box"/>
  <text x="280" y="95" class="label">Kubernetes Service</text>

  <!-- Deployment / Master -->
  <rect x="500" y="40" width="340" height="120" class="box"/>
  <text x="520" y="70" class="label">Jenkins Master (Deployment)</text>
  <text x="520" y="92" class="small">Pods: web UI + controller</text>

  <!-- PVC -->
  <rect x="520" y="170" width="220" height="60" class="box"/>
  <text x="540" y="205" class="label">PersistentVolumeClaim (jenkins-home)</text>

  <!-- Agents -->
  <rect x="500" y="260" width="340" height="120" class="box"/>
  <text x="520" y="290" class="label">Agent Pods (JNLP)</text>
  <text x="520" y="314" class="small">Scale via Deployment/HPA</text>

  <!-- Arrows -->
  <path d="M190 90 L260 90" class="arrow" />
  <path d="M420 90 L500 90" class="arrow" />
  <path d="M600 160 L600 170" class="arrow" />
  <path d="M675 230 L675 260" class="arrow" />

  <!-- Notes -->
  <text x="30" y="360" class="small">Notes: Use `service.yaml` (ClusterIP/NodePort/LoadBalancer), configure `pvc.yaml` for persistence, and `rbac.yaml` / `serviceaccount.yaml` for security.</text>

</svg>
